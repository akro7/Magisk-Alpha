name: Build Android App

on:
  push:
    branches: [ "alpha" ] 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        # هذه الخطوة تضمن تهيئة أدوات الأندرويد بشكل صحيح

      - name: Install Specific NDK
        run: |
          # تثبيت نسخة الـ NDK وتجهيزها
          sdkmanager --install "ndk;25.2.9519653"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # هنا نقوم بتمرير مسار الـ NDK يدوياً لإجبار Gradle على استخدامه بدلاً من المسار الخطأ
        run: ./gradlew assembleDebug -Pandroid.ndkPath=$ANDROID_SDK_ROOT/ndk/25.2.9519653

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
